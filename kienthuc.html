<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiến thức - Tọa Độ Định Tính</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { apple: { light: '#f5f5f7', dark: '#1d1d1f', blue: '#0066cc' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Đã thêm ./ -->
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-apple-light text-apple-dark antialiased">

    <nav class="fixed w-full z-50 glass-nav">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Đã thêm ./ -->
                <a href="./index.html" class="font-bold text-xl tracking-tight hover:text-apple-blue transition">Tọa Độ Định Tính</a>
                <div class="hidden md:flex space-x-8">
                    <!-- Đã thêm ./ -->
                    <a href="./index.html" class="text-sm font-medium text-gray-500 hover:text-apple-blue transition">Trang chủ</a>
                    <a href="./kienthuc.html" class="text-sm font-medium text-apple-blue transition">Kiến thức</a>
                    <a href="./thucchien.html" class="text-sm font-medium text-gray-500 hover:text-apple-blue transition">Thực chiến</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-16 px-4 mx-auto max-w-6xl">
        <div id="listView" class="fade-in-up">
            <h2 class="text-3xl font-bold mb-8">Tài liệu học tập</h2>
            <div id="documentGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="detailView" class="hidden fade-in-up">
            <button id="backBtn" class="mb-6 text-gray-500 hover:text-apple-blue flex items-center transition">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Quay lại danh sách
            </button>
            
            <div class="bg-white p-8 md:p-12 rounded-[2rem] shadow-sm border border-gray-100 relative">
                <button id="downloadPdfBtn" class="absolute top-6 right-6 bg-apple-blue text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-blue-600 transition shadow-md no-print">
                    Tải PDF
                </button>
                <div id="pdfContent" class="mt-8"></div>
            </div>
        </div>
    </main>

    <!-- Đã thêm ./ -->
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/kienthuc.js"></script>
</body>
</html>
